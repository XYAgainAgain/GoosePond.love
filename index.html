<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark">
    <title></title>
    <script>
    (function () {
      var root = document.documentElement;
      function read(key, allowed) {
        var value = null;
        try {
          value = localStorage.getItem(key);
        } catch (e) {}
        return allowed.indexOf(value) !== -1 ? value : null;
      }
      root.setAttribute("data-theme", read("goosepond.theme", ["light", "blackout"]) || "ember");
      var size = read("goosepond.text-size", ["xsmall", "small", "medium", "large", "xlarge"]);
      if (size) root.setAttribute("data-text-size", size);
      var font = read("goosepond.font", ["national-park", "figtree"]);
      if (font) root.setAttribute("data-font", font);
      if (read("goosepond.shortcuts", ["off"])) root.setAttribute("data-shortcuts", "off");
    })();
    </script>
    <link rel="stylesheet" href="/src/ui/styles.css">
  </head>
  <body>
    <div id="app">
      <p class="boot"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
